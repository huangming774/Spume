[package]
name = "taozhiyy-vercel"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
taozhiyy-api = { path = "api/_core" }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
tower = "0.5.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
vercel_runtime = { version = "2.4.1", features = ["axum"] }

[[bin]]
name = "index"
path = "api/index.rs"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
