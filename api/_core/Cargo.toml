[package]
name = "taozhiyy-api"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
axum = { version = "0.8.9", features = ["multipart"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
tower-http = { version = "0.7.1", features = ["cors", "trace"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "uuid", "json"] }
chrono = { version = "0.4.45", features = ["serde"] }
bcrypt = "0.19.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "system-proxy"] }
hmac = "0.13.0"
sha2 = "0.11.1"
md-5 = "0.11.0"
hex = "0.4.3"
base64 = "0.23.1"
thiserror = "2.0.21"
lettre = { version = "0.11.24", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls"] }
rand = "0.10.4"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
http = "1.5.0"
http-body-util = "0.1.5"
bytes = "1.12.2"
dotenvy = "0.15.7"

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
http-body-util = "0.1.5"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
axum = { version = "0.8.9" }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "system-proxy"] }
serde_json = "1.0.154"
chrono = { version = "0.4.45", features = ["serde"] }
hmac = "0.13.0"
sha2 = "0.11.1"
base64 = "0.23.1"
