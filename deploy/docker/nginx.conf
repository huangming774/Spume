# Taozhiyy Docker 版 nginx 配置。
# 由 deploy/docker/Dockerfile.web 打进 web 镜像的 /etc/nginx/conf.d/default.conf。
#
# 路由规则对齐仓库根目录 vercel.json 的 rewrite 逻辑：
#   /api/*        → 反代到 api 服务（Docker 内部网络）
#   /ai-assistant → 静态文件直出，不走 SPA fallback
#   其余所有路径  → 回落 /index.html，交给主站 SPA 的 React Router 处理
#                  （/blog、/build、/projects 都是 SPA 路由，不再是独立子站）
#
# TLS 证书路径对应 docker-compose.yml 里挂载的 ${TLS_CERT_DIR}：
#   /etc/nginx/certs/fullchain.pem
#   /etc/nginx/certs/privkey.pem

# WebSocket 升级转发用（当前 API 未用到，保留是标准反代的稳妥写法）。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ---------- HTTP：只做证书验证 + 跳转 HTTPS ----------
server {
    listen 80;
    listen [::]:80;
    server_name taozhiyy.top www.taozhiyy.top;

    # certbot --webroot 验证用（webroot 挂在 docker-compose 的 cert-webroot 卷上）。
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- HTTPS ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name taozhiyy.top www.taozhiyy.top;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # 和 Go 版 acg-api 对齐：站长上传接口报告的上限是 8MB，
    # 这里给 multipart 请求体留一点余量。
    client_max_body_size 12m;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ---------- API 反代 ----------
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # ---------- AI 助手静态资源：真实文件，不回落 SPA ----------
    location /ai-assistant/ {
        try_files $uri =404;
    }

    # ---------- 带内容哈希的静态资源：长缓存 ----------
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri /index.html;
    }

    # ---------- 其余路径：SPA fallback ----------
    location / {
        # index.html 本身不能被长缓存，否则发版后用户拿不到新资源清单。
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
