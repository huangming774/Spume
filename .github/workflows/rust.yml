name: Spume blog Rust API

run-name: Build Rust API ${{ github.sha }}

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - ".github/workflows/rust.yml"
  pull_request:
    branches: [main]
    paths:
      - "api/**"
      - ".github/workflows/rust.yml"
  workflow_dispatch:

concurrency:
  group: spume-rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: api

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test
